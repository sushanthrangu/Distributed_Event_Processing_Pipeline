server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: consumer-service

  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:events_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:eventuser}
    password: ${DB_PASSWORD:eventpass}
    hikari:
      maximum-pool-size: 10

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:event-consumer-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 200
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual
      type: batch

app:
  kafka:
    topics:
      events: events
      dlq: events.dlq
  processing:
    max-retries: ${KAFKA_CONSUMER_MAX_RETRY:3}
  persistence:
    batch-size: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
